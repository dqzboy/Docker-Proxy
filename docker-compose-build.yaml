# ============================================================
#  使用： docker compose -f docker-compose-build.yaml up -d
# ============================================================

services:
  go-proxy:
    container_name: reg-go-proxy
    build:
      context: ./go-proxy
      dockerfile: Dockerfile
    restart: always
    environment:
      - OTEL_TRACES_EXPORTER=none
      - GO_PROXY_ADMIN_TOKEN=${GO_PROXY_ADMIN_TOKEN:-change-me-to-a-strong-random-token}
      # 出站代理由一键安装脚本按需写入；默认关闭。
      # HTTPS_PROXY 通常也使用 http:// 地址，由代理通过 HTTP CONNECT 转发 HTTPS。
      # - HTTP_PROXY=http://host:port
      # - HTTPS_PROXY=http://host:port
      # - NO_PROXY=localhost,127.0.0.1,::1,go-proxy,reg-go-proxy,hubcmd-ui,.local
    volumes:
      # 配置持久化：宿主机目录挂载，容器内配置在 /app/config.d/config.yaml
      - ./config/go-proxy:/app/config.d
    ports:
      - 50000:5000
    networks:
      - registry-net

  hubcmd-ui:
    container_name: hubcmd-ui
    build:
      context: ./hubcmdui
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - go-proxy
    environment:
      # 指向 go-proxy 的管理端口
      - GO_PROXY_ADMIN_URL=http://go-proxy:5001
      - GO_PROXY_ADMIN_TOKEN=${GO_PROXY_ADMIN_TOKEN:-change-me-to-a-strong-random-token}
      # 会话签名密钥。生成：openssl rand -hex 32
      - SESSION_SECRET=${SESSION_SECRET:-}
      # 镜像搜索由 hubcmd-ui 服务端访问 Docker Hub、GitHub、Quay 等外部 API。
      # 默认不注入代理变量；extra_hosts + DNS/SNI 直连时保持下面三行注释。
      # 使用 HTTP(S) 上游代理时才取消注释；HTTPS 目标会由 UI 建立 CONNECT 隧道。
      # 若同时使用代理和 DNS/SNI，给 NO_PROXY 增加需要经 extra_hosts 直连的域名。
      # 一键安装脚本选择上游代理后会自动启用这三行，可按需单独关闭 UI 的代理。
      # - HTTP_PROXY=http://host:port
      # - HTTPS_PROXY=http://host:port
      # - NO_PROXY=localhost,127.0.0.1,::1,go-proxy,reg-go-proxy,hubcmd-ui,.local
      # HOST_NAME、SECURE_COOKIE 与 Registry 性能参数在后台「系统参数」页面管理。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite 数据库文件
      - ./hubcmdui/data:/app/data
    ports:
      - 30080:3000
    networks:
      - registry-net

networks:
  registry-net:
