services:
  go-proxy:
    image: ${REGISTRY_IMAGE:-dqzboy/registry:latest}
    container_name: reg-go-proxy
    restart: always
    environment:
      - OTEL_TRACES_EXPORTER=none
      - GO_PROXY_ADMIN_TOKEN=${GO_PROXY_ADMIN_TOKEN:-change-me-to-a-strong-random-token}
      # 出站代理由一键安装脚本按需写入；默认关闭。
      # HTTPS_PROXY 通常也使用 http:// 地址，由代理通过 HTTP CONNECT 转发 HTTPS。
      # - HTTP_PROXY=http://host:port
      # - HTTPS_PROXY=http://host:port
      # - NO_PROXY=localhost,127.0.0.1,::1,go-proxy,reg-go-proxy,hubcmd-ui,.local
    # 配置持久化：挂载宿主机目录，容器内配置写在 /app/config.d/config.yaml。
    volumes:
      - ./config/go-proxy:/app/config.d
      # 镜像缓存（开启缓存后落盘于此；默认配置 cache.enabled=false 时不写入）
      - ./data/go-proxy-cache:/app/cache
    ports:
      - 50000:5000
    networks:
      - registry-net

  hubcmd-ui:
    image: ${UI_IMAGE:-dqzboy/hubcmd-ui:latest}
    container_name: hubcmd-ui
    restart: always
    depends_on:
      - go-proxy
    environment:
      # 指向 go-proxy 的管理端口
      - GO_PROXY_ADMIN_URL=http://go-proxy:5001
      - GO_PROXY_ADMIN_TOKEN=${GO_PROXY_ADMIN_TOKEN:-change-me-to-a-strong-random-token}
      # 会话签名密钥
      # 生成：openssl rand -hex 32
      - SESSION_SECRET=${SESSION_SECRET:-}
      # 前台镜像搜索会直接访问 Docker Hub、GitHub、Quay 等外部 API。
      # 一键安装脚本配置上游代理时会与 go-proxy 同步启用以下三项；默认关闭。
      # - HTTP_PROXY=http://host:port
      # - HTTPS_PROXY=http://host:port
      # - NO_PROXY=localhost,127.0.0.1,::1,go-proxy,reg-go-proxy,hubcmd-ui,.local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # SQLite 数据库等运行时数据
      - ./data/hubcmd-ui:/app/data
    ports:
      - 30080:3000
    networks:
      - registry-net

networks:
  registry-net:
